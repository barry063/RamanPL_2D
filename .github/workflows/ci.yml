name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Base tests — no optional extras required
  # -----------------------------------------------------------------------
  base-tests:
    name: Base tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (base)
        run: pip install -e .

      - name: Run base test suite
        # Exclude tests that require optional extras
        run: |
          pip install pytest
          pytest tests/ \
            --ignore=tests/test_mapping_backend_parity.py \
            --ignore=tests/test_preprocessing_backend_resolution.py \
            --ignore=tests/test_single_fit_backend_parity.py \
            --ignore=tests/test_ml_clustering.py \
            -v

  # -----------------------------------------------------------------------
  # Job 2: RamanSPy extras tests
  # -----------------------------------------------------------------------
  extras-tests:
    name: RamanSPy extras tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with RamanSPy extras
        run: pip install -e ".[ramanspy]"

      - name: Run extras test suite
        run: |
          pip install pytest
          pytest tests/test_mapping_backend_parity.py \
                 tests/test_preprocessing_backend_resolution.py \
                 tests/test_single_fit_backend_parity.py \
                 -v

  # -----------------------------------------------------------------------
  # Job 3: ML extras tests
  # -----------------------------------------------------------------------
  ml-extras-tests:
    name: ML extras tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with ml extras
        run: pip install -e ".[ml]"

      - name: Run ml extras test suite
        run: |
          pip install pytest
          pytest tests/test_ml_clustering.py -v

  # -----------------------------------------------------------------------
  # Job 4: Package build (wheel + sdist)
  # -----------------------------------------------------------------------
  package-build:
    name: Package build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build . --outdir dist/

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # -----------------------------------------------------------------------
  # Job 5: Clean-install smoke (install built wheel into a fresh environment)
  # -----------------------------------------------------------------------
  clean-install-smoke:
    name: Clean install smoke
    runs-on: ubuntu-latest
    needs: package-build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install wheel into clean environment
        run: pip install dist/*.whl

      - name: Run packaging smoke tests
        run: |
          pip install pytest
          pytest tests/test_packaging_smoke.py -v

  # -----------------------------------------------------------------------
  # Job 6: Notebook smoke execution
  # -----------------------------------------------------------------------
  notebook-smoke:
    name: Notebook smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and notebook dependencies
        run: |
          pip install -e ".[ramanspy,ml]"
          pip install pytest nbformat nbconvert ipykernel
          python -m ipykernel install --user --name python3

      - name: Run notebook smoke tests
        run: pytest tests/test_notebook_smoke.py -v

  # -----------------------------------------------------------------------
  # Job 7: Benchmark smoke (harness health only — no timing assertions)
  # -----------------------------------------------------------------------
  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Run benchmark smoke tests
        run: |
          pip install pytest
          pytest tests/test_release_benchmark_smoke.py -v

  # -----------------------------------------------------------------------
  # Job 8: Documentation build smoke
  # -----------------------------------------------------------------------
  docs-build:
    name: Documentation build smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install -U pip
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Build documentation
        run: |
          sphinx-build -b html docs/source docs/build/html
