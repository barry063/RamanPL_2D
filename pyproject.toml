[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RamanPL_2D"
version = "0.6.0"
description = "Python toolkit for Raman and photoluminescence spectroscopy analysis in 2D materials."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [
    {name = "Hao Yu", email = "yuhao19980603@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.4",
    "matplotlib>=3.5.2",
    "scipy>=1.11.0",
    "Pillow>=11.2.1",
    "renishawWiRE>=0.1.16",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
ramanspy = [
    "ramanspy>=0.2.10",
]
ml = [
    "scikit-learn>=1.2",
]

[project.urls]
Repository = "https://github.com/barry063/RamanPL_2D"
Issues = "https://github.com/barry063/RamanPL_2D/issues"
Changelog = "https://github.com/barry063/RamanPL_2D/blob/main/CHANGELOG"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ramanpl*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
ramanpl = ["raman_materials.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]